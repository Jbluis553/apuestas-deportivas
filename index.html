<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportBet Center | GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏆 SPORTBET CENTER</h1>
        <nav>
            <button onclick="filtrar('soccer_mexico_ligamx')">🇲🇽 LIGA MX</button>
            <button onclick="filtrar('basketball_nba')">🏀 NBA</button>
            <button onclick="filtrar('soccer_uefa_champs_league')">🇪🇺 CHAMPIONS</button>
        </nav>
    </header>

    <main id="contenedor-apuestas">
        <div class="mensaje-bienvenida">
            <h3>Bienvenido, Jose Luis</h3>
            <p>Selecciona una liga para ver los momios en vivo.</p>
        </div>
    </main>

    <div id="bet-slip">
        <h3>Tu Boleto</h3>
        <p id="bet-team">Selecciona un equipo</p>
        <p>Momio: <span id="bet-odds">0</span></p>
        <input type="number" id="monto" placeholder="Monto $ (ej. 100)" oninput="calcularGanancia()">
        <p>Pago Potencial: <span id="total-win">$0.00</span></p>
        <button class="btn-apostar" onclick="confirmarApuesta()">APRESTAR AHORA</button>
        <button class="btn-cerrar" onclick="cerrarBoleto()">Cerrar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
