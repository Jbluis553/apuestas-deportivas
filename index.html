<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Novibet Clone | Jose Luis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NOVIBET <span style="color:#00ff73">CLONE</span></h1>
        <div id="user-bar">SALDO: $<span id="saldo-display">1000.00</span></div>
        <nav>
            <button onclick="filtrar('soccer_mexico_ligamx')">LIGA MX</button>
            <button onclick="filtrar('basketball_nba')">NBA</button>
            <button onclick="filtrar('soccer_uefa_champs_league')">CHAMPIONS</button>
        </nav>
    </header>

    <main id="contenedor-apuestas"></main>

    <div id="bet-slip">
        <h4 style="margin:0">Boleto de Apuesta</h4>
        <p><span id="bet-team"></span> (<span id="bet-odds"></span>)</p>
        <input type="number" id="monto" placeholder="Cantidad a apostar" oninput="calcularGanancia()" style="width:100%; padding:10px; margin-bottom:10px;">
        <p>Ganancia Potencial: <span id="total-win" style="color:#00ff73">$0.00</span></p>
        <button class="btn-confirmar" onclick="confirmarApuesta()">Colocar Apuesta</button>
        <button onclick="cerrarBoleto()" style="background:none; color:white; border:none; width:100%; margin-top:10px; cursor:pointer;">Cancelar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
